[package]
name = "vikunja-client-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Vikunja API CLI for task/project/label management, optimized for LLM consumption"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/vikunja-client-cli"
keywords = ["vikunja", "cli", "task-management"]
categories = ["command-line-utilities"]
authors = ["Can H. Tartanoglu <gpg@rotas.mozmail.com>"]

[[bin]]
name = "vkc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.18"
tokio = { version = "1", features = ["full"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
