[ci]
runner = "codefloe-global"
with_nextest = true
with_msrv = true
with_deny = true
provider = "crow"
platform = "forgejo"
publish_crates = true
runtime = "nix"

# Linux closure consumed by canix, published to the public canix cache on
# trunk pushes only (secret ATTIC_TOKEN). Pull requests build but never push.
[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
system_runners = { x86_64-linux = "ubuntu-24.04" }
nix_builds = [".#packages.x86_64-linux.default"]
push_branches = ["trunk"]

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "vikunja-client-cli"
token_secret = "ATTIC_TOKEN"
