[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runner = "codefloe-global"
with_nextest = true
with_msrv = true
with_deny = true
provider = "crow"
platform = "forgejo"
publish_crates = true
runtime = "nix"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "vikunja-client-cli"
token_secret = "ATTIC_TOKEN"
